[target.'cfg(not(target_arch = "wasm32"))']
rustflags = ["-Ctarget-cpu=native"]

[target.'cfg(target_os = "emscripten")']
rustflags = [
    "-Ctarget-feature=+atomics,+mutable-globals,+simd128,+relaxed-simd",
    "-Clinker=/usr/lib/emscripten/emcc",
    "-Clink-arg=-sALLOW_MEMORY_GROWTH=1",
    "-Clink-arg=-pthread",
    # change to web,worker for browser
    "-Clink-arg=-sENVIRONMENT=node,worker",
    "-Clink-arg=-sWASM_WORKERS=1",
    # maybe use navigator.hardwareConcurrency on the browser
    "-Clink-arg=-sPTHREAD_POOL_SIZE=16",
    "-Clink-arg=-sSTACK_SIZE=8MB",
    "-Clink-arg=-sGROWABLE_ARRAYBUFFERS=2",
]
