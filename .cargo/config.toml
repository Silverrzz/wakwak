[target.'cfg(not(target_arch = "wasm32"))']
rustflags = ["-Ctarget-cpu=native"]

[target.'cfg(target_os = "emscripten")']
linker = "emcc"
rustflags = [
    "-Ctarget-feature=+atomics,+bulk-memory,+mutable-globals,+simd128",
    "-Cpanic=abort",
    "-Clink-arg=-sALLOW_MEMORY_GROWTH=1",
    "-Clink-arg=-pthread",
    "-Clink-arg=-sENVIRONMENT=web,worker",
    "-Clink-arg=-sMODULARIZE=1",
    "-Clink-arg=-sEXPORT_NAME=createWakwak",
    "-Clink-arg=-sPROXY_TO_PTHREAD=1",
    "-Clink-arg=-sPTHREAD_POOL_SIZE=2",
    "-Clink-arg=-sPTHREAD_POOL_SIZE_STRICT=0",
    "-Clink-arg=-sSTACK_SIZE=8MB",
    "-Clink-arg=-sGROWABLE_ARRAYBUFFERS=2",
    "-Clink-arg=-sDEFAULT_PTHREAD_STACK_SIZE=8MB",
    "-Clink-arg=-sEXIT_RUNTIME=0",
    "-Clink-arg=-sEXPORTED_FUNCTIONS=_main,_wakwak_command,_wakwak_ready",
    "-Clink-arg=-sEXPORTED_RUNTIME_METHODS=ccall",
]
